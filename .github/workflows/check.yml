name: Render deploy alerts

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERVICE_IDS: ${{ vars.SERVICE_IDS || 'srv-dbfv4q4ipgvc73e0i5fg' }}
        run: node check.js

      # Remember alerted deploys so each failure posts only once.
      - name: Save state
        if: always()
        run: |
          if ! git diff --quiet state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update alerted deploys' state.json
            git push
          fi
